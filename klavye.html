```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halil bilişim - Klavye Hız Testi</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fa;
    color:#20252b;
    min-height:100vh;
}

.header{
    background:#fff;
    border-bottom:1px solid #e2e6eb;
    padding:18px 30px;
}

.logo{
    font-size:25px;
    font-weight:800;
    color:#1677ff;
}

.container{
    width:min(1050px,92%);
    margin:35px auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    gap:15px;
}

.title{
    font-size:27px;
    font-weight:700;
}

.timer-box{
    display:flex;
    gap:8px;
}

.time-btn{
    border:1px solid #d8dee7;
    background:#fff;
    padding:10px 17px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
    transition:.2s;
}

.time-btn:hover{
    border-color:#1677ff;
}

.time-btn.active{
    background:#1677ff;
    color:white;
    border-color:#1677ff;
}

.test-card{
    background:white;
    border-radius:13px;
    box-shadow:0 5px 25px rgba(0,0,0,.07);
    border:1px solid #e5e9ee;
    overflow:hidden;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border-bottom:1px solid #e5e9ee;
}

.stat{
    text-align:center;
    padding:18px;
    border-right:1px solid #e5e9ee;
}

.stat:last-child{
    border-right:none;
}

.stat-label{
    color:#7a828c;
    font-size:14px;
    margin-bottom:6px;
}

.stat-value{
    font-size:25px;
    font-weight:700;
}

.text-area{
    padding:32px;
}

.text-box{
    min-height:190px;
    max-height:280px;
    overflow:hidden;
    border:1px solid #e1e6ec;
    border-radius:10px;
    padding:22px;
    background:#fafbfd;
    font-size:24px;
    line-height:1.8;
    word-break:break-word;
    overflow-wrap:anywhere;
    user-select:none;
}

.correct{
    color:#1a9b55;
}

.wrong{
    color:#e63946;
    background:#ffe5e8;
}

.current{
    border-bottom:3px solid #1677ff;
}

.input{
    width:100%;
    margin-top:20px;
    height:65px;
    border:2px solid #dce2e8;
    border-radius:10px;
    padding:0 18px;
    font-size:22px;
    outline:none;
    transition:.2s;
}

.input:focus{
    border-color:#1677ff;
    box-shadow:0 0 0 3px rgba(22,119,255,.1);
}

.input:disabled{
    background:#f2f4f7;
}

.bottom{
    margin-top:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#747c85;
    font-size:14px;
}

.start-btn{
    border:none;
    background:#1677ff;
    color:white;
    padding:12px 22px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:700;
}

.start-btn:hover{
    background:#0868eb;
}

/* SONUÇ */

.result-screen{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,22,30,.55);
    backdrop-filter:blur(5px);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.result{
    width:min(650px,100%);
    background:white;
    border-radius:18px;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.result h2{
    text-align:center;
    font-size:30px;
    margin-bottom:25px;
}

.big-result{
    text-align:center;
    margin-bottom:28px;
}

.big-wpm{
    font-size:60px;
    font-weight:800;
    color:#1677ff;
}

.big-label{
    color:#747c85;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.result-item{
    background:#f5f7fa;
    border-radius:10px;
    padding:18px;
}

.result-item span{
    display:block;
    color:#777f88;
    font-size:13px;
    margin-bottom:7px;
}

.result-item strong{
    font-size:22px;
}

.restart{
    width:100%;
    margin-top:22px;
    height:50px;
    border:none;
    border-radius:9px;
    background:#1677ff;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

@media(max-width:700px){

    .header{
        padding:15px 18px;
    }

    .container{
        width:94%;
        margin-top:20px;
    }

    .top{
        flex-direction:column;
        align-items:stretch;
    }

    .timer-box{
        justify-content:center;
    }

    .time-btn{
        flex:1;
    }

    .text-area{
        padding:18px;
    }

    .text-box{
        font-size:19px;
        line-height:1.7;
    }

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .stat{
        padding:13px 5px;
    }

    .stat-value{
        font-size:20px;
    }

    .result{
        padding:25px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">Halil BİLİŞİM</div>
</header>

<main class="container">

    <div class="top">

        <div class="title">
            Klavye Hız Testi
        </div>

        <div class="timer-box">
            <button class="time-btn active" data-time="30">30 sn</button>
            <button class="time-btn" data-time="60">60 sn</button>
            <button class="time-btn" data-time="120">120 sn</button>
            <button class="time-btn" data-time="300">5 dk</button>
        </div>

    </div>

    <section class="test-card">

        <div class="stats">

            <div class="stat">
                <div class="stat-label">Süre</div>
                <div class="stat-value" id="time">30</div>
            </div>

            <div class="stat">
                <div class="stat-label">Hız</div>
                <div class="stat-value" id="wpm">0</div>
            </div>

            <div class="stat">
                <div class="stat-label">Doğruluk</div>
                <div class="stat-value" id="accuracy">100%</div>
            </div>

        </div>

        <div class="text-area">

            <div class="text-box" id="textBox"></div>

            <input
                id="input"
                class="input"
                type="text"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="Yazmaya başlamak için buraya tıklayın..."
            >

        </div>

    </section>

    <div class="bottom">

        <span>
            Yazmaya başladığınız anda süre başlar.
        </span>

        <button class="start-btn" id="resetBtn">
            Yeniden Başlat
        </button>

    </div>

</main>


<!-- SONUÇ EKRANI -->

<div class="result-screen" id="resultScreen">

    <div class="result">

        <h2>Test Tamamlandı</h2>

        <div class="big-result">

            <div class="big-wpm" id="finalWpm">
                0
            </div>

            <div class="big-label">
                Kelime / Dakika
            </div>

        </div>

        <div class="result-grid">

            <div class="result-item">
                <span>Doğru Yazılan Kelime</span>
                <strong id="finalWords">0</strong>
            </div>

            <div class="result-item">
                <span>Doğruluk</span>
                <strong id="finalAccuracy">0%</strong>
            </div>

            <div class="result-item">
                <span>Doğru Karakter</span>
                <strong id="finalCorrect">0</strong>
            </div>

            <div class="result-item">
                <span>Yanlış Karakter</span>
                <strong id="finalWrong">0</strong>
            </div>

        </div>

        <button class="restart" id="againBtn">
            Tekrar Dene
        </button>

    </div>

</div>


<script>

const texts = [

"bugün güzel bir gün yeni şeyler öğrenmek insanın kendisine yaptığı en iyi yatırımlardan biridir",

"klavye kullanırken düzenli çalışmak zaman içerisinde daha hızlı ve doğru yazmanızı sağlar",

"başarılı olmak için sabırlı olmak ve her gün biraz daha fazla çalışmak gerekir",

"bilgisayar teknolojileri günümüzde hayatımızın önemli bir parçası haline gelmiştir",

"yeni bilgiler öğrenmek ve bunları uygulamak kendimizi geliştirmemize yardımcı olur",

"oyun geliştirmek tasarım yapmak ve bilgisayar kullanmayı öğrenmek eğlenceli olabilir"

];

let selectedTime = 30;
let remaining = 30;
let started = false;
let finished = false;
let timer = null;
let startTime = 0;

let correctChars = 0;
let wrongChars = 0;
let correctWords = 0;

const textBox = document.getElementById("textBox");
const input = document.getElementById("input");

const timeDisplay = document.getElementById("time");
const wpmDisplay = document.getElementById("wpm");
const accuracyDisplay = document.getElementById("accuracy");

const resultScreen = document.getElementById("resultScreen");

const finalWpm = document.getElementById("finalWpm");
const finalWords = document.getElementById("finalWords");
const finalAccuracy = document.getElementById("finalAccuracy");
const finalCorrect = document.getElementById("finalCorrect");
const finalWrong = document.getElementById("finalWrong");

let currentText = "";


/* YENİ METİN */

function generateText(){

    currentText = "";

    while(currentText.length < 900){

        let random =
            texts[Math.floor(Math.random() * texts.length)];

        currentText += " " + random;

    }

    currentText = currentText.trim();

    textBox.innerHTML = "";

    [...currentText].forEach((char,index)=>{

        const span = document.createElement("span");

        span.textContent = char;
        span.dataset.index = index;

        textBox.appendChild(span);

    });
}


/* SÜRE SEÇ */

document.querySelectorAll(".time-btn").forEach(button=>{

    button.addEventListener("click",()=>{

        if(started) return;

        document.querySelectorAll(".time-btn")
        .forEach(btn=>btn.classList.remove("active"));

        button.classList.add("active");

        selectedTime =
            Number(button.dataset.time);

        remaining = selectedTime;

        timeDisplay.textContent = remaining;

    });

});


/* YAZMAYA BAŞLA */

input.addEventListener("input",()=>{

    if(finished) return;

    if(!started){

        started = true;
        startTime = Date.now();

        timer = setInterval(updateTimer,1000);

    }

    checkText();

});


/* METNİ KONTROL ET */

function checkText(){

    const typed = input.value;

    const letters =
        textBox.querySelectorAll("span");

    correctChars = 0;
    wrongChars = 0;

    letters.forEach((span,index)=>{

        span.classList.remove(
            "correct",
            "wrong",
            "current"
        );

        if(index < typed.length){

            if(
                typed[index].toLowerCase() ===
                currentText[index].toLowerCase()
            ){

                span.classList.add("correct");
                correctChars++;

            }else{

                span.classList.add("wrong");
                wrongChars++;

            }

        }

    });


    if(typed.length < letters.length){

        letters[typed.length]
        .classList.add("current");

    }


    calculateCorrectWords();
    updateStats();

}


/* DOĞRU YAZILAN KELİMELER */

function calculateCorrectWords(){

    const typedWords =
        input.value.trim().split(/\s+/);

    const originalWords =
        currentText.trim().split(/\s+/);

    correctWords = 0;

    for(let i = 0; i < typedWords.length; i++){

        if(
            typedWords[i].toLowerCase() ===
            originalWords[i].toLowerCase()
        ){

            correctWords++;

        }

    }

}


/* İSTATİSTİK */

function updateStats(){

    const elapsed =
        (Date.now() - startTime) / 1000;

    if(elapsed <= 0) return;

    const minutes = elapsed / 60;

    const wpm =
        Math.round(
            (correctChars / 5) / minutes
        );

    const total =
        correctChars + wrongChars;

    const accuracy =
        total === 0
        ? 100
        : Math.round(
            (correctChars / total) * 100
        );

    wpmDisplay.textContent =
        isFinite(wpm) ? wpm : 0;

    accuracyDisplay.textContent =
        accuracy + "%";

}


/* ZAMANLAYICI */

function updateTimer(){

    remaining--;

    timeDisplay.textContent =
        remaining;

    updateStats();

    if(remaining <= 0){

        finishTest();

    }

}


/* TESTİ BİTİR */

function finishTest(){

    clearInterval(timer);

    finished = true;
    started = false;

    input.disabled = true;

    calculateCorrectWords();

    const elapsed =
        selectedTime / 60;

    const wpm =
        Math.round(
            (correctChars / 5) / elapsed
        );

    const total =
        correctChars + wrongChars;

    const accuracy =
        total === 0
        ? 100
        : Math.round(
            (correctChars / total) * 100
        );


    finalWpm.textContent =
        isFinite(wpm) ? wpm : 0;

    finalWords.textContent =
        correctWords;

    finalAccuracy.textContent =
        accuracy + "%";

    finalCorrect.textContent =
        correctChars;

    finalWrong.textContent =
        wrongChars;

    resultScreen.style.display =
        "flex";

}


/* YENİDEN BAŞLAT */

function resetTest(){

    clearInterval(timer);

    started = false;
    finished = false;

    remaining = selectedTime;

    correctChars = 0;
    wrongChars = 0;
    correctWords = 0;

    timeDisplay.textContent =
        remaining;

    wpmDisplay.textContent =
        "0";

    accuracyDisplay.textContent =
        "100%";

    input.disabled = false;
    input.value = "";

    generateText();

    input.focus();

}


document.getElementById("resetBtn")
.addEventListener("click",resetTest);


document.getElementById("againBtn")
.addEventListener("click",()=>{

    resultScreen.style.display =
        "none";

    resetTest();

});


/* BAŞLANGIÇ */

generateText();

input.focus();

</script>

</body>
</html>
